# Configuration Netlify.
#
# ⚠ Lire docs/deploiement.md avant de déployer : trois fonctionnalités du
# produit ne peuvent pas s'exécuter sur Netlify en l'état (stockage,
# compilation LaTeX, rendu Chromium). Ce fichier permet à la partie
# consultation de se déployer correctement ; il ne rend pas l'application
# complète fonctionnelle.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Évite que le runtime tente d'empaqueter les binaires natifs.
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les routes d'export dépendent de binaires absents de l'environnement Netlify.
# Sans redirection vers un service externe, elles répondent en erreur explicite.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
